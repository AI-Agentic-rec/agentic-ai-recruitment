# Whole stack:  cp .env.example .env  &&  docker compose up --build
# API docs: http://localhost:8000/docs      Seed data: docker compose run --rm seed
#
# Start-up order:  postgres + redis (healthy)  ->  migrate (alembic upgrade head, runs once)  ->  api + worker

x-backend: &backend
  build:
    context: .
    dockerfile: docker/backend.Dockerfile
  env_file:
    - path: .env
      required: false
  environment: &backend-env
    # Inside the Docker network the database host is the service name `postgres`, not localhost.
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-recruitment_user}:${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-recruitment_db}
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/2
    UPLOAD_DIR: storage/uploads
  volumes:
    - .:/app # development: code changes are picked up without rebuilding
    - uploads_data:/app/storage/uploads

services:
  postgres:
    image: postgres:17-alpine
    container_name: recruitment_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recruitment_db}
      POSTGRES_USER: ${POSTGRES_USER:-recruitment_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: recruitment_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job: creates / upgrades the tables, then exits. api and worker wait for it to succeed.
  migrate:
    <<: *backend
    container_name: recruitment_migrate
    command: alembic upgrade head
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    container_name: recruitment_api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health/db', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    <<: *backend
    container_name: recruitment_worker
    restart: unless-stopped
    command: celery -A app.celery_app:celery_app worker --loglevel=info
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Not started by `docker compose up`. Run it once:  docker compose run --rm seed
  seed:
    <<: *backend
    container_name: recruitment_seed
    profiles: ["seed"]
    command: python -m database.seed.seed
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
  uploads_data:
