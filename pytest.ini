[pytest]
# Les tests se trouvent à côté du code (agents/, backend/) et dans tests/ (bout en bout).
# pythonpath = .        : permet d'écrire  from agents.common.schemas import ...
# pythonpath = backend  : permet d'écrire  from app.main import app
testpaths = agents backend tests
pythonpath = . backend
python_files = test_*.py
