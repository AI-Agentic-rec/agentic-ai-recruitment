name: Tests

# Lance les tests à chaque push sur main et à chaque pull request.
# Aucun test n'appelle Ollama : les modèles sont remplacés par de faux modèles.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            agents/requirements.txt
            backend/requirements.txt

      - name: Installer Tesseract (OCR) avec le pack français
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-fra

      - name: Installer les dépendances Python
        run: python -m pip install -r requirements.txt

      - name: Lancer tous les tests
        run: |
          python -m pytest -q || code=$?
          # code 5 = aucun test trouvé : normal tant que le projet est vide
          if [ "${code:-0}" -eq 5 ]; then echo "Aucun test pour l'instant."; exit 0; fi
          exit "${code:-0}"
