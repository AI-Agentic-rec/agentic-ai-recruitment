
name: Tests

# Lance les tests à chaque push sur main et à chaque pull request.
# Les tests des mocks et des schémas ne nécessitent pas Ollama.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Tester les mocks et les schémas
        run: python -m pytest agents/tests/test_mocks.py -v
